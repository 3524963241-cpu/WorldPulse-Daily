# WorldPulse Daily —— 自动更新新闻并发布网站（B 同学负责）
# ============================================================
# 作用：
#   1. 每天北京时间 08:30（UTC 00:30）自动运行新闻更新脚本；
#   2. 也支持在 GitHub 网页上手动触发（Actions → 选本工作流 → Run workflow）；
#   3. 新闻更新成功后，把新的 data/news.json 提交回仓库，并立即发布到 GitHub Pages。
#
# 为什么只有一个 job（重要）：
#   早期版本拆成了「更新新闻」+「发布网站」两个 job，结果发布 job 的 checkout
#   拿到的是「本次运行刚开始时」的旧 commit，把更新前的 news.json 发布出去了 ——
#   仓库里数据是最新的，线上却是旧的。合并成一个 job 后，打包的是更新后的工作目录，
#   从根本上消除了这个问题。请勿再拆回两个 job。
#
# 失败保护：update_news.py 抓取失败或结果过少时以非零码退出，整个任务随即失败，
#   不会提交坏数据、也不会发布新页面 —— 线上网站继续使用上一次成功发布的内容。
#
# 使用前必须做的两件事（详见 docs/B同学操作手册.md）：
#   ① 仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"；
#   ② 如需密钥翻译，在 Settings → Secrets and variables → Actions 添加
#      TRANSLATE_API_KEY（TRANSLATE_PROVIDER 默认 mymemory，可不用密钥）。

name: 更新新闻并发布网站

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30。GitHub 定时任务可能延迟几分钟到几十分钟，属正常现象。
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 允许手动触发，Day 2 演示时用这个

# 权限说明：
#   contents: write  —— 允许把新的 news.json 提交回仓库
#   pages / id-token  —— GitHub Pages 官方部署方式所需
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个更新任务，避免两次运行互相覆盖
concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    name: 更新新闻并发布网站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---------- 1. 准备环境 ----------
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # ---------- 2. 抓取并更新新闻数据 ----------
      # 脚本失败会以非零码退出，后续步骤不会执行，线上保持上一次的内容。
      - name: 运行新闻更新脚本
        run: python3 scripts/update_news.py
        env:
          # 翻译服务从仓库 Secrets 读取，不写进代码。未配置密钥时用免费 MyMemory。
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER || 'mymemory' }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}

      # ---------- 3. 把新数据提交回仓库 ----------
      - name: 提交新的 news.json
        run: |
          git config user.name  "news-bot"
          git config user.email "actions@github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "news.json 没有变化，跳过提交。"
          else
            git commit -m "自动更新新闻 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # ---------- 4. 打包并发布（打包的是本 job 更新后的工作目录）----------
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包静态网站
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库就是静态网站（index.html、css/、js/、data/）
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
